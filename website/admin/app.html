<!DOCTYPE html>
<html lang="en" data-i18n-title="nav.translations">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Matoo Power</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
  <link rel="icon" href="/assets/favicon.svg">
</head>
<body>
  <div class="app-shell">
    <!-- ========== Sidebar ========== -->
    <aside class="sidebar">
      <div class="brand">
        <img src="/assets/logo-white.svg" alt="Matoo Power">
        <div class="ver">Admin v1.0</div>
      </div>
      <ul class="nav-tabs">
        <li><button class="active" data-view="i18n" data-i18n="nav.translations">Translations</button></li>
        <li><button data-view="images" data-i18n="nav.images">Images</button></li>
        <li><button data-view="keys" data-i18n="nav.keys">Key Audit</button></li>
        <li><button data-view="settings" data-i18n="nav.settings">Settings</button></li>
        <li><button data-view="overview" data-i18n="nav.overview">Overview</button></li>
        <li><button data-view="audit" data-i18n="nav.audit">Activity Log</button></li>
      </ul>
      <div class="sidebar-foot">
        <div class="lang-switch" id="lang-switch" data-i18n-title="nav.language" title="Language">
          <button type="button" data-lang="en" class="active" aria-label="English" data-i18n-aria-label="lang.english">English</button>
          <button type="button" data-lang="zh" aria-label="中文" data-i18n-aria-label="lang.chinese">中文</button>
        </div>
        <button id="logout-btn" data-i18n="nav.signout">Sign out</button>
      </div>
    </aside>

    <!-- ========== Main ========== -->
    <div class="main">
      <header class="topbar">
        <h1 id="view-title">Translations</h1>
        <div class="actions">
          <span class="status" id="status" data-i18n="topbar.ready">ready</span>
          <a href="/" target="_blank" class="btn btn-ghost btn-sm" data-i18n="topbar.viewSite">View site ↗</a>
        </div>
      </header>

      <main class="view" id="view-root">
        <!-- View content injected by admin.js -->
      </main>
    </div>
  </div>

  <!-- ========== Templates ========== -->
  <template id="tpl-i18n">
    <div class="i18n-toolbar">
      <div class="lang-pills" id="lang-pills">
        <button data-lang="en" class="active">English</button>
        <button data-lang="zh">中文</button>
        <button data-lang="bn">বাংলা</button>
        <button data-lang="ja">日本語</button>
        <button data-lang="ko">한국어</button>
        <button data-lang="vi">Tiếng Việt</button>
        <button data-lang="hi">हिन्दी</button>
        <button data-lang="ur">اردو</button>
        <button data-lang="ta">தமிழ்</button>
        <button data-lang="te">తెలుగు</button>
        <button data-lang="ar">العربية</button>
        <button data-lang="fr">Français</button>
        <button data-lang="pt">Português</button>
        <button data-lang="es">Español</button>
      </div>
      <input class="input search" id="key-search" data-i18n-placeholder="i18n.search" placeholder="Search keys…">
      <button class="btn btn-ghost" id="reload-btn" data-i18n="i18n.reload">Reload</button>
    </div>
    <div class="i18n-grid">
      <div class="key-list" id="key-list"></div>
      <div class="editor-pane" id="editor-pane">
        <div class="empty" data-i18n="i18n.selectKey">Select a key to edit.</div>
      </div>
    </div>
  </template>

  <template id="tpl-images">
    <div class="img-toolbar">
      <label class="btn btn-primary" data-i18n="images.upload">Upload
        <input type="file" id="upload-input" accept=".jpg,.jpeg,.png,.webp,.svg" multiple hidden>
      </label>
      <input class="input search" id="img-search" data-i18n-placeholder="images.filter" placeholder="Filter by name…" style="max-width:240px;">
      <button class="btn btn-ghost" id="reload-images-btn" data-i18n="images.reload">Reload</button>
    </div>
    <div class="dropzone" id="dropzone" data-i18n="images.dropHint">Drop images here to upload.</div>
    <div class="img-grid" id="img-grid"></div>
  </template>

  <template id="tpl-keys">
    <p style="margin-bottom:14px;color:var(--color-slate-500);font-size:var(--fs-sm);"
       data-i18n="keys.description">
      Translation keys that appear in HTML via <code>data-i18n</code> but
      are missing from the JSON files.
    </p>
    <div class="audit-list" id="keys-list"></div>
  </template>

  <template id="tpl-audit">
    <div class="img-toolbar">
      <select class="select" id="audit-filter" style="max-width:200px;">
        <option value="" data-i18n="audit.filterAll">All actions</option>
        <option value="i18n">i18n</option>
        <option value="images">images</option>
        <option value="auth">auth</option>
        <option value="settings">settings</option>
      </select>
      <button class="btn btn-ghost" id="reload-audit-btn" data-i18n="audit.reload">Reload</button>
    </div>
    <div class="audit-list" id="audit-list"></div>
  </template>

  <!-- ========== Settings template ========== -->
  <template id="tpl-settings">
    <div class="settings-toolbar">
      <button class="btn btn-ghost" id="settings-reload" data-i18n="settings.reload">Reload</button>
      <button class="btn btn-ghost" id="settings-reset" data-i18n="settings.reset">Reset to defaults</button>
      <span class="settings-meta" id="settings-meta"></span>
    </div>
    <form id="settings-form" class="settings-form" autocomplete="off">
      <fieldset class="settings-section">
        <legend data-i18n="settings.section.whatsapp">WhatsApp</legend>
        <p class="hint" data-i18n="settings.section.whatsappHint">
          Single primary number plus per-region overrides. Numbers are digits only (E.164, no '+').
        </p>

        <label class="field">
          <span data-i18n="settings.field.enabled">Enabled</span>
          <label class="switch">
            <input type="checkbox" name="whatsapp.enabled">
            <span class="slider"></span>
          </label>
        </label>

        <label class="field">
          <span data-i18n="settings.field.whatsappNumber">Primary number</span>
          <input class="input" type="text" name="whatsapp.number" placeholder="6591234567" pattern="\d{7,15}">
        </label>

        <label class="field">
          <span data-i18n="settings.field.defaultMessage">Default message</span>
          <textarea class="input" name="whatsapp.defaultMessage" rows="2"></textarea>
        </label>

        <div class="region-grid">
          <label class="field">
            <span data-i18n="settings.field.regionSea">SEA</span>
            <input class="input" type="text" name="whatsapp.byRegion.sea" placeholder="6591234567">
          </label>
          <label class="field">
            <span data-i18n="settings.field.regionMena">MENA</span>
            <input class="input" type="text" name="whatsapp.byRegion.mena" placeholder="971501234567">
          </label>
          <label class="field">
            <span data-i18n="settings.field.regionSa">South Asia</span>
            <input class="input" type="text" name="whatsapp.byRegion.sa" placeholder="8801712345678">
          </label>
          <label class="field">
            <span data-i18n="settings.field.regionAfrica">Africa</span>
            <input class="input" type="text" name="whatsapp.byRegion.africa" placeholder="2348012345678">
          </label>
          <label class="field">
            <span data-i18n="settings.field.regionLatam">LATAM</span>
            <input class="input" type="text" name="whatsapp.byRegion.latam" placeholder="5511999998888">
          </label>
        </div>

        <label class="field">
          <span data-i18n="settings.field.disabledInProd">Disable placeholder wa.me links in production</span>
          <label class="switch">
            <input type="checkbox" name="whatsapp.disabledInProd">
            <span class="slider"></span>
          </label>
        </label>
      </fieldset>

      <fieldset class="settings-section">
        <legend data-i18n="settings.section.contact">Contact</legend>

        <label class="field">
          <span data-i18n="settings.field.contactEmail">Sales email</span>
          <input class="input" type="email" name="contact.email" placeholder="sales@matoopower.com">
        </label>

        <label class="field">
          <span data-i18n="settings.field.wechatId">WeChat ID</span>
          <input class="input" type="text" name="contact.wechatId">
        </label>

        <label class="field">
          <span data-i18n="settings.field.wechatQrUrl">WeChat QR image URL</span>
          <input class="input" type="text" name="contact.wechatQrUrl" placeholder="/assets/qr-wechat.svg">
        </label>

        <label class="field">
          <span data-i18n="settings.field.hqLine">HQ line (footer)</span>
          <input class="input" type="text" name="contact.hqLine">
        </label>

        <label class="field">
          <span data-i18n="settings.field.addressSg">Address · Singapore</span>
          <input class="input" type="text" name="contact.address.sg">
        </label>

        <label class="field">
          <span data-i18n="settings.field.addressCn">Address · China</span>
          <input class="input" type="text" name="contact.address.cn">
        </label>

        <label class="field">
          <span data-i18n="settings.field.addressBd">Address · Bangladesh</span>
          <input class="input" type="text" name="contact.address.bd">
        </label>
      </fieldset>

      <fieldset class="settings-section">
        <legend data-i18n="settings.section.social">Social</legend>
        <p class="hint" data-i18n="settings.section.socialHint">
          Leave a field empty to hide the icon. URLs must be on the official platform domain.
        </p>
        <label class="field">
          <span>Facebook</span>
          <div class="field-input-wrap">
            <input class="input" type="url" name="social.facebook"
                   data-social-domain="facebook"
                   placeholder="https://www.facebook.com/MatooPower">
            <span class="field-hint" data-i18n="settings.field.socialFacebookHint">Allowed: facebook.com · fb.com · fb.me</span>
          </div>
        </label>
        <label class="field">
          <span>LinkedIn</span>
          <div class="field-input-wrap">
            <input class="input" type="url" name="social.linkedin"
                   data-social-domain="linkedin"
                   placeholder="https://www.linkedin.com/company/matoo-power">
            <span class="field-hint" data-i18n="settings.field.socialLinkedinHint">Allowed: linkedin.com · lnkd.in</span>
          </div>
        </label>
        <label class="field">
          <span>Twitter / X</span>
          <div class="field-input-wrap">
            <input class="input" type="url" name="social.twitter"
                   data-social-domain="twitter"
                   placeholder="https://twitter.com/MatooPower">
            <span class="field-hint" data-i18n="settings.field.socialTwitterHint">Allowed: twitter.com · x.com · t.co</span>
          </div>
        </label>
        <label class="field">
          <span>YouTube</span>
          <div class="field-input-wrap">
            <input class="input" type="url" name="social.youtube"
                   data-social-domain="youtube"
                   placeholder="https://www.youtube.com/@MatooPower">
            <span class="field-hint" data-i18n="settings.field.socialYoutubeHint">Allowed: youtube.com · youtu.be · yt.be</span>
          </div>
        </label>
        <label class="field">
          <span>Instagram</span>
          <div class="field-input-wrap">
            <input class="input" type="url" name="social.instagram"
                   data-social-domain="instagram"
                   placeholder="https://www.instagram.com/matoopower">
            <span class="field-hint" data-i18n="settings.field.socialInstagramHint">Allowed: instagram.com · instagr.am</span>
          </div>
        </label>
      </fieldset>

      <fieldset class="settings-section">
        <legend data-i18n="settings.section.legal">Legal entities</legend>
        <label class="field">
          <span data-i18n="settings.field.legalCn">CN entity</span>
          <input class="input" type="text" name="legalEntity.cn">
        </label>
        <label class="field">
          <span data-i18n="settings.field.legalCnRole">CN role</span>
          <input class="input" type="text" name="legalEntity.cnRole">
        </label>
        <label class="field">
          <span data-i18n="settings.field.legalSg">SG entity</span>
          <input class="input" type="text" name="legalEntity.sg">
        </label>
        <label class="field">
          <span data-i18n="settings.field.legalSgRole">SG role</span>
          <input class="input" type="text" name="legalEntity.sgRole">
        </label>
      </fieldset>

      <fieldset class="settings-section">
        <legend data-i18n="settings.section.meta">Site meta</legend>
        <label class="field">
          <span data-i18n="settings.field.siteName">Site name</span>
          <input class="input" type="text" name="meta.siteName">
        </label>
        <label class="field">
          <span data-i18n="settings.field.tagline">Tagline</span>
          <input class="input" type="text" name="meta.tagline">
        </label>
        <label class="field">
          <span data-i18n="settings.field.responseSlaHours">Response SLA (hours)</span>
          <input class="input" type="number" min="0" max="720" name="meta.responseSlaHours">
        </label>
      </fieldset>

      <div class="settings-foot">
        <span class="info" data-i18n="settings.saveHint">Changes apply immediately to the public site on next page load.</span>
        <div>
          <button type="button" class="btn btn-ghost" id="settings-cancel" data-i18n="settings.cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="settings-save" data-i18n="settings.save">Save</button>
        </div>
      </div>
    </form>
  </template>

  <template id="tpl-overview">
    <div class="overview-toolbar">
      <div class="range-tabs" id="ov-range" role="tablist">
        <button data-range="24h" class="active" data-i18n="overview.range.24h">24h</button>
        <button data-range="7d" data-i18n="overview.range.7d">7d</button>
        <button data-range="30d" data-i18n="overview.range.30d">30d</button>
        <button data-range="all" data-i18n="overview.range.all">All</button>
      </div>
      <button class="btn btn-ghost btn-sm" id="ov-reload" data-i18n="overview.refresh">Refresh</button>
      <span class="ov-hint" id="ov-hint" data-i18n="overview.hint">Tracked from this machine only.</span>
    </div>

    <div class="kpi-row" id="ov-kpis"></div>

    <div class="analytics-grid">
      <section class="panel">
        <h2 data-i18n="overview.sections.browsing">Browsing</h2>
        <div class="panel-body">
          <h3 data-i18n="overview.trend">Daily views &amp; visitors</h3>
          <div class="sparkline-host" id="ov-spark-views"></div>
        </div>
        <div class="panel-body">
          <h3 data-i18n="overview.top.pages">Top pages</h3>
          <ol class="top-list" id="ov-top-pages"></ol>
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="overview.sections.logins">Logins</h2>
        <div class="panel-body">
          <h3 data-i18n="overview.trend">Daily logins &amp; fails</h3>
          <div class="sparkline-host" id="ov-spark-logins"></div>
        </div>
        <div class="panel-body">
          <h3 data-i18n="overview.top.failIps">Top failing IPs</h3>
          <ol class="top-list" id="ov-top-fails"></ol>
        </div>
        <div class="panel-body">
          <h3 data-i18n="overview.recentLogins">Recent logins</h3>
          <div class="timeline" id="ov-recent-logins"></div>
        </div>
      </section>
    </div>

    <div class="analytics-grid">
      <section class="panel">
        <h2 data-i18n="overview.top.langs">Languages</h2>
        <ol class="top-list" id="ov-top-langs"></ol>
      </section>
      <section class="panel">
        <h2 data-i18n="overview.top.ua">User-agent classes</h2>
        <ol class="top-list" id="ov-top-ua"></ol>
      </section>
    </div>
  </template>

  <div id="toast-host"></div>

  <script src="/admin/assets/admin-i18n.js"></script>
  <script src="/admin/assets/admin.js"></script>
</body>
</html>
