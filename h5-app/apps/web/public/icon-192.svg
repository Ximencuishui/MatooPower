<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- PWA icon:对齐 website/assets/logo.svg 的六边形 + 蓝绿渐变 M 标识 -->
  <!-- 背景圆角 + 六边形 + 渐变 M + 绿色 accent -->
  <rect width="192" height="192" rx="36" fill="#F7FAF8"/>
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="100%" stop-color="#36B37E"/>
    </linearGradient>
  </defs>
  <!-- Hexagon (深蓝底,等同于 website logo) -->
  <path d="M96 16 L166 56 L166 136 L96 176 L26 136 L26 56 Z" fill="#091E42"/>
  <!-- M letter with blue→green gradient -->
  <path d="M66 136 L66 76 L86 76 L106 106 L146 76 L146 136 L131 136 L131 91 L116 116 L96 116 L81 91 L81 136 Z" fill="url(#iconGrad)"/>
  <!-- Green accent square -->
  <rect x="136" y="126" width="15" height="15" rx="2" fill="#36B37E"/>
</svg>